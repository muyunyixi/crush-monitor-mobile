name: Check mini program

on:
  push:
    paths:
      - 'source/apps/miniprogram/**'
      - 'source/worker/**'
      - 'source/server/**'
      - 'source/shared/**'
      - 'source/tests/**'
      - 'source/package*.json'
      - '.github/workflows/miniprogram.yml'
  pull_request:
    paths:
      - 'source/apps/miniprogram/**'
      - 'source/worker/**'
      - 'source/server/**'
      - 'source/shared/**'
      - 'source/tests/**'
      - 'source/package*.json'
      - '.github/workflows/miniprogram.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
        working-directory: source
      - run: npm test
        working-directory: source
      - run: npm run build
        working-directory: source
