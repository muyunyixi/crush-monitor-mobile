name: Deploy Worker and mobile web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    outputs:
      endpoint: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker and quota storage
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 5eb927b5a24c6e2c274c2ad3a25162d5
          wranglerVersion: "4"
          command: deploy
      - name: Verify Worker health endpoint
        env:
          WORKER_ENDPOINT: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$WORKER_ENDPOINT"
          curl --fail --silent --show-error \
            -H "Origin: https://muyunyixi.github.io" \
            "$WORKER_ENDPOINT/health"

  pages:
    name: Test, build and deploy GitHub Pages
    needs: worker
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/*.test.ts
      - name: Build with deployed Worker endpoint
        env:
          VITE_ANALYSIS_ENDPOINT: ${{ needs.worker.outputs.endpoint }}
        run: |
          test -n "$VITE_ANALYSIS_ENDPOINT"
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
