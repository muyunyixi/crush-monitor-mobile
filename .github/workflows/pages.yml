name: Deploy Worker and mobile web

on:
  push:
    branches: [main]
    paths:
      - "source/apps/web/**"
      - "source/worker/**"
      - "source/server/**"
      - "source/shared/**"
      - "source/scripts/**"
      - "source/tests/**"
      - "source/package.json"
      - "source/package-lock.json"
      - "source/vite.config.ts"
      - "source/tsconfig.json"
      - "source/wrangler.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker and publish verified web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
        working-directory: source
      - run: npm test
        working-directory: source
      - run: npm run build
        working-directory: source
      - name: Deploy Worker and quota storage
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 5eb927b5a24c6e2c274c2ad3a25162d5
          workingDirectory: source
          wranglerVersion: "4"
          command: deploy
      - name: Verify Worker health endpoint
        env:
          WORKER_ENDPOINT: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$WORKER_ENDPOINT"
          curl --fail --silent --show-error \
            -H "Origin: https://muyunyixi.github.io" \
            "$WORKER_ENDPOINT/health"
      - name: Build with deployed Worker endpoint
        env:
          VITE_ANALYSIS_ENDPOINT: ${{ vars.PUBLIC_WORKER_URL || steps.deploy.outputs.deployment-url }}
        working-directory: source
        run: |
          test -n "$VITE_ANALYSIS_ENDPOINT"
          npm run build
      - name: Publish verified build to the Pages branch root
        run: |
          cp source/dist/index.html index.html
          mkdir -p ocr
          cp source/dist/ocr/* ocr/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ocr
          if ! git diff --cached --quiet; then
            git commit -m "deploy: publish verified Worker endpoint"
            git push
          fi
